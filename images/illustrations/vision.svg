<svg preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300"><style>
.sweep{transform-origin:350px 150px;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pr{transform-origin:350px 150px;animation:pring 3.2s ease-out infinite;opacity:0}
.pr.b{animation-delay:1.6s}
@keyframes pring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.dpath{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 4.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:420}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.sun{transform-origin:350px 225px;animation:sunr 6s ease-in-out infinite alternate}
@keyframes sunr{from{transform:translateY(22px)}to{transform:translateY(-8px)}}
.halo{transform-origin:350px 225px;animation:halo 4s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.18);opacity:.45}}
.win{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{fill-opacity:.25}50%{fill-opacity:.95}}
.orbit{transform-origin:350px 250px;animation:spin 16s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dpath{stroke-dashoffset:0}.pr{opacity:.3}}
</style><defs><linearGradient id="vsk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1B2C"/><stop offset=".6" stop-color="#24476F"/><stop offset="1" stop-color="#E8801A"/></linearGradient></defs><rect width="700" height="300" fill="url(#vsk)"/><circle class="win" cx="60" cy="40" r="1.8" fill="#fff" style="animation-delay:0s"/><circle class="win" cx="160" cy="70" r="1.8" fill="#fff" style="animation-delay:1s"/><circle class="win" cx="240" cy="30" r="1.8" fill="#fff" style="animation-delay:2s"/><circle class="win" cx="470" cy="50" r="1.8" fill="#fff" style="animation-delay:0.5s"/><circle class="win" cx="560" cy="90" r="1.8" fill="#fff" style="animation-delay:1.5s"/><circle class="win" cx="640" cy="35" r="1.8" fill="#fff" style="animation-delay:2.4s"/><circle class="win" cx="400" cy="80" r="1.8" fill="#fff" style="animation-delay:0.8s"/><g class="orbit"><ellipse cx="350" cy="250" rx="230" ry="230" fill="none" stroke="#fff" stroke-opacity=".14" stroke-dasharray="4 10"/><circle cx="580" cy="250" r="5" fill="#00E6DC"/></g><circle class="halo" cx="350" cy="225" r="140" fill="#E8801A"/><g class="sun"><circle cx="350" cy="225" r="78" fill="#F7B267"/></g><rect x="40" y="190" width="60" height="90" fill="#0B1626"/><rect x="115" y="130" width="44" height="150" fill="#0B1626"/><rect x="170" y="170" width="70" height="110" fill="#0B1626"/><rect x="255" y="110" width="40" height="170" fill="#0B1626"/><rect x="420" y="140" width="50" height="140" fill="#0B1626"/><rect x="485" y="200" width="70" height="80" fill="#0B1626"/><rect x="570" y="155" width="60" height="125" fill="#0B1626"/><rect x="640" y="185" width="50" height="95" fill="#0B1626"/><rect class="win" x="125" y="150" width="8" height="10" fill="#F7B267" style="animation-delay:0s"/><rect class="win" x="125" y="175" width="8" height="10" fill="#F7B267" style="animation-delay:1.1s"/><rect class="win" x="265" y="125" width="8" height="10" fill="#F7B267" style="animation-delay:0.5s"/><rect class="win" x="265" y="155" width="8" height="10" fill="#F7B267" style="animation-delay:1.8s"/><rect class="win" x="265" y="185" width="8" height="10" fill="#F7B267" style="animation-delay:0.9s"/><rect class="win" x="430" y="160" width="8" height="10" fill="#F7B267" style="animation-delay:1.4s"/><rect class="win" x="430" y="190" width="8" height="10" fill="#F7B267" style="animation-delay:0.3s"/><rect class="win" x="580" y="175" width="8" height="10" fill="#F7B267" style="animation-delay:2.1s"/><rect class="win" x="590" y="200" width="8" height="10" fill="#F7B267" style="animation-delay:0.7s"/><rect x="0" y="280" width="700" height="20" fill="#0B1626"/><line x1="0" y1="280" x2="700" y2="280" stroke="#E8801A" stroke-opacity=".8" stroke-width="2"/></svg>